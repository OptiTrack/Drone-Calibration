name: Verify Qt Drone UI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-qt-drone-ui:
    name: Build Qt Drone UI
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia qtnetwork'
          cache: true
      
      - name: Install dependencies
        run: |
          choco install cmake ninja -y
      
      - name: Configure CMake
        working-directory: qt-drone-ui
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        working-directory: qt-drone-ui
        run: |
          cmake --build build --config Release
      
      - name: Verify executable exists
        working-directory: qt-drone-ui
        run: |
          if (Test-Path "build/QtDroneUI.exe") {
            Write-Host "✓ QtDroneUI executable built successfully"
          } else {
            Write-Host "✗ QtDroneUI executable not found"
            exit 1
          }
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QtDroneUI-Windows-Qt6.10.0
          path: |
            qt-drone-ui/build/QtDroneUI.exe
          retention-days: 7 