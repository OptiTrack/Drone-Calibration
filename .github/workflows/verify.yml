name: Verify Qt Drone UI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-qt-drone-ui:
    name: Build Qt Drone UI
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        qt-version: ['6.10.0']
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt-version }}
          host: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          target: 'desktop'
          arch: ${{ runner.os == 'Windows' && 'win64_mingw' || 'gcc_64' }}
          modules: 'qtmultimedia qtnetwork'
          cache: true
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y
      
      - name: Configure CMake
        working-directory: qt-drone-ui
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        working-directory: qt-drone-ui
        run: |
          cmake --build build --config Release
      
      - name: Verify executable exists
        working-directory: qt-drone-ui
        shell: bash
        run: |
          if [ -f "build/QtDroneUI.exe" ] || [ -f "build/QtDroneUI" ]; then
            echo "QtDroneUI executable built successfully"
          else
            echo "QtDroneUI executable not found"
            exit 1
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: QtDroneUI-${{ matrix.os }}-Qt${{ matrix.qt-version }}
          path: |
            qt-drone-ui/build/QtDroneUI*
          retention-days: 7 